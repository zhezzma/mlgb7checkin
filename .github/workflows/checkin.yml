name: Checkin

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 时间：01:00 UTC = 北京时间每天 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

# 签到结果需要提交回仓库（checkin.log）
permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 签到
        id: checkin
        env:
          CHATGPT2API_SESSION: ${{ secrets.CHATGPT2API_SESSION }}
        run: bash checkin.sh

      - name: 提交签到日志
        if: always() # 签到失败也留下记录，方便排查
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkin.log
          if git diff --cached --quiet; then
            echo "日志无变化，跳过提交"
            exit 0
          fi
          git commit -m "checkin: $(cat checkin.log)"
          git push
